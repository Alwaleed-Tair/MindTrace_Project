# docker compose up --build        -> backend on http://localhost:8000 (data in ./data)
# The web UI (frontend/, by Omar) has its own Dockerfile: docker compose --profile frontend up --build
services:
  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      MINDTRACE_DATA_DIR: /data
    volumes:
      - ./data:/data
    ports:
      - "8000:8000"
  frontend:
    profiles: ["frontend"]
    build: ./frontend
    depends_on: [backend]
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
