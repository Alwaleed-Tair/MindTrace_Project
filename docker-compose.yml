# docker compose up --build        -> the whole app (UI + API) on http://localhost:8000, data in the "mindtrace-data" volume
services:
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      MINDTRACE_DATA_DIR: /data
    volumes:
      - mindtrace-data:/data
    ports:
      - "8000:8000"
volumes:
  mindtrace-data:
